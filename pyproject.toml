[project]
name = "vdjaqp"
version = "0.1.0"
description = "Link LC-MS/MS antibody peptides to BCR repertoire clonotypes"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "seqtree==1.3.4",
    "arda-mapper==2.38.7",
    "vdjtools==5.9.2",     # IGH generation probability and the recombination model
]

[project.urls]
Homepage = "https://github.com/antigenomics/vdjaqp"
Documentation = "https://docs.isalgo.dev/vdjaqp/"
Repository = "https://github.com/antigenomics/vdjaqp"
Issues = "https://github.com/antigenomics/vdjaqp/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
data = ["huggingface_hub>=0.30", "filelock>=4.2.10"]
docs = ["sphinx==8.2.3", "pydata-sphinx-theme==0.16.1"]

[project.scripts]
vdjaqp-data = "vdjaqp.data_hub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdjaqp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
docs = ["sphinx==8.2.3", "pydata-sphinx-theme==0.16.1"]
