name: ci
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --extra test --extra docs --extra data --frozen
      - name: Unit and synthetic tests
        run: .venv/bin/python -m pytest tests -q
      - name: Toy example
        run: .venv/bin/python examples/toy/run_toy.py
      - name: Documentation (warnings are errors)
        run: make -C docs html
      - name: Data bootstrap CLI
        run: .venv/bin/vdjaqp-data --help
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.2'
      - name: Data-free workflow integration
        run: |
          .venv/bin/python workflows/make_fixture.py tmp/ci-input --mock-ms
          printf 'airr,examples/inputs/rearrangements.tsv,%s/tmp/ci-input/peptides.parquet,synthetic AIRR,%s/tmp/ci-input/model.json\n' "$PWD" "$PWD" >> tmp/ci-input/samples.csv
          nextflow run main.nf --samples tmp/ci-input/samples.csv --outdir tmp/ci-output --cpus 1
          uvx --from snakemake==9.13.7 snakemake --cores 1 --config samples=tmp/ci-input/samples.csv outdir=tmp/ci-snakemake
          if uvx --from snakemake==9.13.7 snakemake --forceall --cores 1 --config samples=tmp/ci-input/samples.csv outdir=tmp/ci-snakemake; then
            exit 1
          fi
          .venv/bin/python - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          import polars as pl
          for sample in ('technical', 'airr'):
              root = Path('tmp/ci-output') / sample / 'analysis'
              report = json.loads((root / 'report.json').read_text())
              assert report['candidates'] == 1
              assert report['peptides'] == 10_000
              assert report['truth_loaded'] is False
              assert report['runtime']['seqtree']
              outputs = report['outputs']
              assert set(outputs) == {p.name for p in root.glob('*.parquet')}
              for name, receipt in outputs.items():
                  assert receipt['sha256'] == hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert pl.read_parquet(root / 'scores.parquet')['clone_id'].to_list() == ['c0']
              other = Path('tmp/ci-snakemake') / sample / 'analysis'
              assert {p.name for p in other.glob('*.parquet')} == set(outputs)
              other_report = json.loads((other / 'report.json').read_text())
              for key in ('candidates', 'peptides', 'alignments', 'inputs', 'producer', 'truth_loaded'):
                  assert report[key] == other_report[key]
              from polars.testing import assert_frame_equal
              assert set(other_report['outputs']) == set(outputs)
              for name, receipt in other_report['outputs'].items():
                  assert receipt['sha256'] == hashlib.sha256((other / name).read_bytes()).hexdigest()
                  assert_frame_equal(pl.read_parquet(root / name), pl.read_parquet(other / name), check_row_order=False)
          PYTHON
